<template>
    <lightning-card title="Manage Contacts" icon-name="standard:contact">
        <div class="slds-p-around_medium slds-text-heading_medium">
        </div>

        <div class="slds-grid slds-wrap slds-p-horizontal_medium slds-m-bottom_medium">
            <div class="slds-col slds-size_4-of-12 slds-p-horizontal_medium">
                <lightning-input
                    label="First Name"
                    name="firstName"
                    type="text"
                    value={firstName}
                    onchange={handleInputChange}>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_4-of-12 slds-p-horizontal_medium">
                <lightning-input
                    label="Last Name"
                    name="lastName"
                    type="text"
                    value={lastName}
                    onchange={handleInputChange}>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_4-of-12 slds-p-horizontal_medium">
                <lightning-input
                    label="Email"
                    name="email"
                    type="email"
                    value={email}
                    required
                    onchange={handleInputChange}>
                </lightning-input>
            </div>
        </div>

        <div class="slds-grid slds-wrap slds-p-horizontal_medium slds-m-bottom_medium">
            <div class="slds-col slds-size_4-of-12 slds-p-horizontal_medium">
                <lightning-input
                    label="Phone"
                    name="phone"
                    type="tel"
                    value={phone}
                    onchange={handleInputChange}>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_4-of-12 slds-p-horizontal_medium">
                <lightning-input
                    label="Search Contacts"
                    name="searchTerm"
                    type="text"
                    placeholder="Search by First Name or Last Name"
                    onchange={handleSearchChange}>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_4-of-12 slds-p-horizontal_medium slds-align-bottom">
                <lightning-button
                    label="Add Contact"
                    variant="brand"
                    onclick={handleAddContact}>
                </lightning-button>
            </div>
        </div>

        <div class="slds-grid slds-wrap slds-align_absolute-center">
            <div class="slds-col slds-size_6-of-12">
                <template if:true={contacts}>
                    <lightning-datatable
                        key-field="Id"
                        data={contacts}
                        columns={columns}
                        draft-values={draftValues}
                        hide-checkbox-column="true"
                        editable="true"
                        onsave={handleSave}
                        onrowaction={handleRowAction}
                        class="slds-m-top_medium">
                    </lightning-datatable>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
